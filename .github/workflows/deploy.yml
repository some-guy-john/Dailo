name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate content fixtures
        run: |
          npm run validate:content -- content/wordle-words.example.json
          npm run validate:connections -- content/connections-puzzles.example.json

      - name: Start local Postgres
        run: npx supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Validate database migrations
        run: npx supabase db lint --local

      - name: Run database tests
        run: npx supabase test db --local supabase/tests

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test --workers=1
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Verify compiled Pages entrypoint
        shell: bash
        run: |
          test -f dist/index.html
          grep -q './assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}"
